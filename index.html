<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>DMKR Audio</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2A082C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DMKR Audio">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="apple-touch-icon" href="/img/logo.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
    html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none;background:#0F0311;scroll-behavior:smooth}
    body{background:#0F0311;color:#fff;padding-top:calc(104px + env(safe-area-inset-top,0px));padding-bottom:calc(75px + env(safe-area-inset-bottom,0px));overflow-x:hidden;width:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    img{-webkit-user-drag:none}
    input{-webkit-user-select:text;user-select:text}
    button{font-family:inherit}

    .app-header{position:fixed;top:0;left:0;right:0;background:#2A082C;z-index:1000;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
    .header-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
    .brand-logo{font-size:1.1rem;font-weight:900;color:#E040FB}
    .search-bar{flex:1;background:#1A051D;border:1px solid #4A0E4E;border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:.85rem}
    .search-bar input{background:transparent;border:none;color:#FFF;outline:none;width:100%;font-size:16px}
    .cart-btn{position:relative;background:none;border:none;font-size:1.3rem;color:#fff;padding:2px 4px}
    .badge{position:absolute;top:-6px;right:-6px;background:#E040FB;color:#fff;border-radius:10px;font-size:.6rem;font-weight:800;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
    .badge.zero{display:none}
    .header-location{font-size:.75rem;color:#D1C4E9}

    .view{display:none;opacity:0;transform:translateY(10px)}
    .view.active{display:block;animation:in .28s ease forwards}
    @keyframes in{to{opacity:1;transform:none}}

    .hero{margin:12px;background:linear-gradient(135deg,#3A0B3E,#1A051D);border-radius:12px;padding:16px;border:1px solid #4A0E4E}
    .hero h2{font-size:1.2rem;font-weight:800}
    .hero p{font-size:.8rem;color:#B39DDB;margin-top:4px}
    .cats{display:flex;gap:10px;overflow-x:auto;padding:4px 12px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .cats::-webkit-scrollbar{display:none}
    .cat{background:#1A051D;border:1px solid #2A082C;border-radius:20px;padding:8px 16px;font-size:.8rem;white-space:nowrap;color:#E1BEE7;transition:.2s}
    .cat.active{background:#8E24AA;color:#fff;font-weight:700;border-color:#E040FB}
    .title{font-size:1rem;font-weight:700;margin:12px 12px 8px}
    .empty{text-align:center;color:#B39DDB;padding:48px 24px;font-size:.9rem;line-height:1.5}
    .empty b{display:block;font-size:2rem;margin-bottom:8px}

    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px}
    .card{position:relative;background:#1A051D;border:1px solid #2A082C;border-radius:10px;padding:10px;display:flex;flex-direction:column;justify-content:space-between}
    .pimg{width:100%;height:120px;object-fit:contain;background:#fff;border-radius:6px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:3rem}
    .fav{position:absolute;top:14px;right:14px;background:rgba(15,3,17,.7);border:none;border-radius:50%;width:32px;height:32px;font-size:1rem;color:#fff;z-index:1}
    .pt{font-size:.8rem;color:#E0E0E0;line-height:1.2;height:3.6em;overflow:hidden;margin-bottom:6px}
    .pp{font-size:.9rem;font-weight:800;color:#E040FB;margin-bottom:8px;line-height:1.25}
    .pp small{display:block;font-size:.65rem;font-weight:700;color:#B39DDB}
    .buy{background:#8E24AA;color:#fff;border:none;padding:10px;border-radius:6px;font-weight:700;font-size:.75rem;width:100%}
    .buy:active{background:#AB47BC;transform:scale(.97)}

    .row{display:flex;align-items:center;gap:10px;background:#1A051D;border:1px solid #2A082C;border-radius:10px;padding:10px;margin:0 12px 10px}
    .row .pimg{width:64px;height:64px;font-size:1.8rem;margin:0;flex:none}
    .row .info{flex:1;min-width:0}
    .row .pt{height:auto;margin-bottom:4px}
    .qty{display:flex;align-items:center;gap:10px;margin-top:6px}
    .qty button{background:#3A0B3E;color:#fff;border:1px solid #4A0E4E;border-radius:6px;width:30px;height:30px;font-size:1rem}
    .total{margin:12px;background:#2A082C;border-radius:10px;padding:14px;display:flex;justify-content:space-between;font-weight:800}
    .pay{display:block;margin:0 12px;width:calc(100% - 24px);background:#8E24AA;color:#fff;border:none;border-radius:10px;padding:14px;font-weight:800;font-size:.95rem}
    .note{margin:0 12px 10px;background:#1A051D;border:1px solid #2A082C;border-radius:10px;padding:12px;font-size:.85rem;color:#E0E0E0;line-height:1.35}
    .note small{display:block;color:#B39DDB;margin-top:4px}
    .menu{width:calc(100% - 24px);margin:0 12px 10px;background:#1A051D;border:1px solid #2A082C;border-radius:10px;padding:14px;color:#fff;text-align:left;font-size:.9rem;display:flex;justify-content:space-between}
    .profile{text-align:center;padding:20px 12px}
    .avatar{width:72px;height:72px;border-radius:50%;background:#8E24AA;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:2rem}

    .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#1A051D;border-top:1px solid #2A082C;display:flex;justify-content:space-around;align-items:center;z-index:1000}
    .nav{position:relative;background:none;border:none;display:flex;flex-direction:column;align-items:center;color:#777;font-size:.65rem;padding:6px 4px;transition:.2s}
    .nav.active{color:#E040FB;font-weight:700}
    .nav .i{font-size:1.2rem;margin-bottom:2px;filter:grayscale(1);opacity:.7;transition:.2s}
    .nav.active .i{filter:none;opacity:1;transform:scale(1.15)}
    .nav .badge{top:0;right:-2px}

    .toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#8E24AA;color:#fff;padding:10px 18px;border-radius:20px;font-size:.8rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:200
